world:
  name: "赛博朋克：霓虹深渊"
  theme: "赛博朋克"
  narrative_style: "冷酷/紧张/科技感"
  difficulty: "标准"
  narrative_length: 7
  language: "中文"
  genre_contract:
    id: "mass_system_survival"
    name: "全民系统投放型求生"
    collective_transmission: true
    shared_start: true
    region_size: 1000
    global_count: 100000000
    public_system:
      regional_chat: true
      private_chat: true
      trading: true
      rankings: true
      achievements: true
      announcements: true
    protagonist_contract:
      unique_mechanic_required: true
      comparative_advantage_target: 0.60
      automatic_success: false
      tone: ["rational", "confident", "proactive"]
    population_distribution:
      panicked_players: {min: 0.15, max: 0.20}
      ordinary_players: {min: 0.45, max: 0.55}
      skilled_players: {min: 0.20, max: 0.25}
      regional_elites: {min: 0.05, max: 0.08}
      special_rivals: {min: 0.01, max: 0.03}
    difficulty_calibration:
      system_operations: {resistance_min: 0, resistance_max: 6}
      daily_talk: {resistance_min: 4, resistance_max: 8}
      newbie_exploration: {resistance_min: 10, resistance_max: 16}
      normal_danger: {resistance_min: 18, resistance_max: 24}
      high_risk: {resistance_min: 28, resistance_max: 38}
    failure_distribution:
      critical_success_pct: {min: 0.08, max: 0.10}
      normal_success_pct: {min: 0.70, max: 0.75}
      costly_success_pct: {min: 0.15, max: 0.22}
      partial_failure_pct: {min: 0.55, max: 0.65}
      severe_failure_pct: {min: 0.30, max: 0.40}
      catastrophic_failure_pct: 0.05
  professions: {}
  starting_profession: null
  talent_deck:
    - id: "cyber_warfare"
      name: "网络战士"
      description: "精通网络入侵战术，可以在战斗中快速破解敌方系统"
      rarity: "A"
      effect:
        action_modifiers:
          HACKING: 0.20
        attribute_bonus:
          spirit: 2
    - id: "neural_damping"
      name: "神经阻尼器"
      description: "减少精神伤害和疲劳积累，在高压环境下保持冷静"
      rarity: "B"
      effect:
        action_modifiers:
          RESIST_STRESS: 0.15
        attribute_bonus:
          constitution: 2
    - id: "mod_master"
      name: "义体大师"
      description: "擅长改装和优化义体设备，获得额外性能增益"
      rarity: "A"
      effect:
        action_modifiers:
          CRAFT: 0.20
        attribute_bonus:
          strength: 2
  setting:
    safe_base: "下城区第 7 号集装箱基地"
    external_dangers:
      - "义体改造失控"
      - "企业私兵"
      - "网络病毒"
      - "黑市帮派"
    exploration_method: "义体植入与黑客入侵"
    disaster_cycle: "每 7 天一次净化的'数据风暴'"
    disaster_type: "数据风暴"
  resources:
    primary:
      - name: "信用点"
        description: "通用货币"
      - name: "芯片"
        description: "义体和系统的核心组件"
      - name: "纳米修复液"
        description: "治疗创伤和修复损坏"
      - name: "量子密钥"
        description: "稀有加密密钥"
      - name: "电池单元"
        description: "能量存储设备"
    secondary:
      - name: "强化材料"
    rare: []
    currency: "信用点"
  public_survival:
    system_name: "赛博求生系统"
    region_name: "新上海第 7 区"
    opening_announcement: "欢迎来到新上海第 7 区生存挑战！所有参赛者已同步接入神经链接系统，你们的每一个决策都将影响排名和存活率。"
    opening_rules:
      - "每个区域都有企业监控，被发现会触发惩罚"
      - "每日零点是数据风暴预热期，风险加倍"
      - "排行榜前 10% 可在第七天获得稀有补给空投"
      - "与其他玩家交易可能被背叛，需谨慎"
      - "完成企业任务可获得额外资源，但可能暴露位置"
      - "死亡后保留 30% 物品在复活点重生"
    starting_channel_messages:
      - sender: "系统通知"
        message: "全区已有 98,547,231 人同步接入，当前在线 87,234,112 人"
      - sender: "CyberWolf_99"
        message: "第 3 区的网吧已经被黑帮占领了，大家小心!"
      - sender: "NeonRider"
        message: "我刚才在黑市换了个低级义眼，视野清晰多了"
      - sender: "DataGhost"
        message: "有人知道企业任务的真实奖励吗？昨天做了三个只给了几百信用点"
      - sender: "VoidHunter"
        message: "警告：东区地下通道出现不明信号，建议绕行"
    initial_peers:
      - id: "peer_001"
        name: "影刃"
        opening_strategy: "优先搜集武器和防御义体，走激进路线"
        visible_edge: "初始携带一把激光匕首（攻击力 +3）"
      - id: "peer_002"
        name: "网际行者"
        opening_strategy: "专精网络入侵，快速破解安全系统获取资源"
        visible_edge: "初始自带高级防火墙模块，受攻击概率 -20%"
      - id: "peer_003"
        name: "机械师艾拉"
        opening_strategy: "建立小型制造工坊，持续产出耗材"
        visible_edge: "初始解锁二级 crafting 配方库"
      - id: "peer_004"
        name: "幽灵"
        opening_strategy: "擅长潜行和隐匿，避免正面冲突"
        visible_edge: "初始穿着光学迷彩服（潜行成功率 +15%）"
    competition:
      initial_percentile: 50
      outcome_scores:
        "大成功": 15
        "普通成功": 5
        "成功但付出代价": 2
        "失败但获得部分信息": 1
        "局部失败": 0
        "严重失败": -5
        "死亡": -20
      location_discovery_bonus: 3
      knowledge_bonus: 2
      positive_resource_bonus_cap: 10
      percentile_per_score: 0.5
      loss_roll_threshold: 25
      losses_per_trigger: 3
      rank_season_end_turn: 50
      active_rival_count: 2
  rules:
    safe_zone:
      description: "基地内部受到电子防护罩保护"
      limitation: "防护罩能量耗尽后失效，需要补充能源"
    exploration:
      frequency: "每天一次正式探索"
      return_rule: "必须在数据风暴来临前返回基地"
      night_modifier: "夜间行动隐蔽性 +20%，但遭遇敌人概率 +15%"
    death:
      type: "checkpoint"
      inventory_drop_rate: 0.3
    disaster:
      cycle_days: 7
      first_event: "第 7 天"
      escalation: "每次风暴强度 +10%，持续时间延长 1 小时"
    pvp:
      enabled: true
      safe_zone_pvp: false
    progression:
      player_level: true
      base_level: true
      talent_per_level: true
  generation:
    mechanics_source: "llm_world_blueprint"
    world_creator: "llm"
    generated_fields: []
