  taboo_domains:
    - "不可设定无敌天赋"
    - "不可跳过资源管理"
    - "不可回避社交博弈"
player_talent:
  name: "神经超频"
  description: "主角的神经突触经过特殊改造，可以在短时间内进入'超频状态'，大幅提升信息处理速度和反应能力。这种能力源自非法实验的产物，既是天赋也是诅咒。"
  trigger: "每日限用一次，持续 30 分钟；使用后精神力 -30，需要 12 小时恢复"
  effect: "超频状态下，所有智力检定和反应速度相关的判定优势 +25%; 可以解析隐藏信息 1 次"
  limitations: "无法连续使用，使用后会产生剧烈头痛（疲劳 +20），且容易被高级 AI 侦测到异常信号"
  mechanical_effect:
    action_modifiers:
      HACKING: 0.25
      INVESTIGATION: 0.25
      COMBAT_REACTION: 0.25
  strategic_loop:
    input: "通过深度潜入高风险区域获取高价值数据和稀有义体组件"
    conversion: "利用神经超频的解析能力识别隐藏价值和弱点，以最小代价获取最大收益"
    competitive_impact: "在全民系统中，其他玩家只能依靠装备和等级，主角可以提前获取关键信息和战略优势"
    counterplay: "企业级 AI 会自动标记高频使用者，帮派精英会对已知威胁采取针对性猎杀"
  opening_card:
    advantage: "开局即可解析一个隐藏信息源（如废弃设施中的秘密仓库、NPC 的交易底牌等）"
    first_use: "第一天立即使用，选择废弃数据中心或企业办公楼的隐藏入口，直接获得首周关键资源"
    comparison: "普通玩家需要花费大量时间试探和侦查，主角可以直接锁定高价值目标"
    hard_limit: "使用后当天无法进行其他高风险行动（神经系统过载），且 24 小时内无法再次使用任何类似能力"
