world:
  name: "赛博朋克：霓虹求生"
  theme: "赛博朋克"
  narrative_style: "冷酷、黑暗、充满科技感"
  difficulty: "标准"
  narrative_length: 7
  language: "中文"
  genre_contract: "1"
  
  professions: {}
  starting_profession: null
  
  talent_deck:
    - id: "neuro_link_v2"
      name: "神经链接 v2.0"
      description: "增强大脑与网络的直接连接能力"
      rarity: "A"
      effect:
        action_modifiers:
          RESEARCH: 0.25
          HACKING: 0.30
        attribute_bonus:
          spirit: 2
    - id: "chrome_arm"
      name: "义肢手臂"
      description: "强化战斗与体力型任务"
      rarity: "B"
      effect:
        action_modifiers:
          COMBAT: 0.20
          BUILD: 0.15
        attribute_bonus:
          strength: 3
          constitution: 1
    - id: "data_miner"
      name: "数据矿工"
      description: "从废弃电子设备中提取有价值信息"
      rarity: "B"
      effect:
        action_modifiers:
          EXTRACT: 0.35
          RECYCLE: 0.25
        attribute_bonus:
          agility: 2

  setting:
    safe_base: "锈铁方舟"
    external_dangers: "辐射尘暴、变异生物、敌对帮派、网络入侵者"
    exploration_method: "废墟探索与技术回收"
    disaster_cycle: "每 7 天一次辐射尘暴"
    disaster_type: "辐射尘暴"
  
  resources:
    primary:
      - name: 废铁
        description: 基础建筑材料
      - name: 燃料
        description: 能源储备
      - name: 食物包
        description: 维持生存的基础营养剂
      - name: 电池
        description: 电力设备能源
      - name: 芯片
        description: 高科技组件
    secondary:
      - name: 药品
      - name: 工具套件
      - name: 防护装备
    rare:
      - name: 量子核心
      - name: 纳米材料
    currency: "信用点"

  public_survival:
    system_name: "全球求生系统"
    region_name: "太平洋废墟区"
    opening_announcement: "所有玩家已被投放至太平洋废墟区，7 天后首次辐射尘暴将覆盖全区域。只有存活并积累足够积分者才能进入下一阶段。"
    opening_rules:
      - "每日清晨 6:00 至傍晚 18:00 为安全活动时段"
      - "夜晚会 spawn 高危险度的变异生物"
      - "排行榜前 10% 的玩家可获得额外资源补给"
      - "死亡将掉落 70% 的背包物品并在复活点重生"
    starting_channel_messages:
      - sender: "系统管理员"
        message: "警告：检测到东区出现大规模变异生物群，请玩家避免靠近！"
      - sender: "幸存者_Alpha"
        message: "有人知道吗？西区的资源点已经被一个帮派控制了"
      - sender: "TechRebuilder"
        message: "我刚刚在旧地铁站发现了一个可修复的太阳能发电机"
      - sender: "NomadWalker"
        message: "昨晚差点死在辐射狼嘴里，大家晚上千万别单独行动"
      - sender: "DataMiner99"
        message: "废旧服务器里的芯片价值很高，值得冒险去捡"
    initial_peers:
      - id: "AlphaLeader"
        name: "阿尔法领袖"
        opening_strategy: "初期快速占领资源密集区，建立据点"
        visible_edge: "拥有 3 名初始队友和一套完整防御工事"
      - id: "TechGuru"
        name: "技术大师"
        opening_strategy: "专注于科技升级和资源转化效率"
        visible_edge: "已解锁高级 crafting 配方，可制作稀有装备"
      - id: "CombatVet"
        name: "战斗老兵"
        opening_strategy: "通过战斗快速获取经验和战利品"
        visible_edge: "等级 3 级，配备军用级武器和防具"
      - id: "ScavQueen"
        name: "拾荒女王"
        opening_strategy: "高效探索和资源收集，避免正面冲突"
        visible_edge: "移动仓库容量+50%，搜索成功率+25%"
      - id: "ShadowNet"
        name: "暗影网虫"
        opening_strategy: "利用黑客技术和隐秘行动获取优势"
        visible_edge: "可远程入侵敌方设施，窃取资源和情报"
    competition:
      initial_percentile: 50
      outcome_scores:
        大成功：100
        普通成功：50
        成功但付出代价：30
        失败但获得部分信息：15
        局部失败：5
        严重失败：0
        死亡：-50
      location_discovery_bonus: 25
      knowledge_bonus: 20
      positive_resource_bonus_cap: 100
      percentile_per_score: 0.5
      loss_roll_threshold: 75
      losses_per_trigger: 3
      rank_season_end_turn: 50
      active_rival_count: 5

  rules:
    safe_zone:
      description: "基地内部受到保护，不会受到外界威胁"
      limitation: "基地核心被摧毁后保护失效"
    exploration:
      frequency: "每天一次"
      return_rule: "找到撤离点或返回基地才能结束探索"
      night_modifier: "夜间危险×3"
    death:
      type: "checkpoint"
      inventory_drop_rate: 0.70
    disaster:
      cycle_days: 7
      first_event: "第 7 天"
      escalation: "每次灾难强度 +15%,持续 3 天"
    pvp:
      enabled: false
      safe_zone_pvp: false
    progression:
      player_level: true
      base_level: true
      talent_per_level: true
  
  mechanics:
    capabilities:
      combat: null
      building: null
      crafting: null
      factions: null
      disasters: null
      trading: null
      peer_simulation: null
      
    ranking:
      enabled_dimensions: []
      dimension_weights: {}
      dimension_scales: {}
      
    peer_simulation:
      enabled: true
      action_pool: ["EXPLORATION", "COMBAT", "CRAFTING", "BASE_MANAGEMENT", "TRADE"]
      population_size: 15
      rolling_window: 10

  world_blueprint:
    starting_location: "锈铁方舟基地"
    locations:
      - id: "downtown_ruins"
        name: "市中心废墟"
        safe: false
        discovered: false
        travel_cost: 120
        extraction_point: true
      - id: "old_subway"
        name: "旧地铁系统"
        safe: false
        discovered: false
        travel_cost: 90
        extraction_point: true
      - id: "tech_wasteland"
        name: "科技垃圾场"
        safe: false
        discovered: false
        travel_cost: 150
        extraction_point: true
      - id: "corporate_tower"
        name: "企业大厦"
        safe: false
        discovered: false
        travel_cost: 180
        extraction_point: true
        high_value: true
      - id: "power_station"
        name: "废弃电站"
        safe: false
        discovered: false
        travel_cost: 200
        extraction_point: true
        requires_key: true
    enemies:
      - id: "rad_rat"
        name: "辐射老鼠"
        hp: 30
        attack: 8
        defense: 3
        exp: 10
        drop: ["废铁", "变异的皮毛"]
        location: ["downtown_ruins", "old_subway"]
      - id: "mutant_scavenger"
        name: "变异拾荒者"
        hp: 60
        attack: 15
        defense: 8
        exp: 25
        drop: ["破旧的工具", "少量食物", "随机芯片"]
        location: ["downtown_ruins", "tech_wasteland"]
      - id: "rad_wolf"
        name: "辐射狼"
        hp: 80
        attack: 20
        defense: 10
        exp: 35
        drop: ["狼皮", "狼肉 (可食用)", "牙齿"]
        location: ["tech_wasteland", "outskirts"]
      - id: "cyber_ghoul"
        name: "网络丧尸"
        hp: 100
        attack: 25
        defense: 15
        exp: 50
        drop: ["损坏的植入体", "加密芯片"]
        location: ["corporate_tower", "old_subway"]
      - id: "boss_rad_titan"
        name: "辐射泰坦"
        hp: 500
        attack: 80
        defense: 50
        exp: 500
        drop: ["量子碎片", "纳米装甲图纸"]
        location: ["power_station"]
        boss: true
    areas:
      - id: "downtown_zone"
        name: "市中心生态区"
        danger_level: 2
        resources: ["废铁", "芯片", "电子元件"]
        enemies: ["rad_rat", "mutant_scavenger"]
        special_loot: ["旧时代照片", "机械手表"]
        extraction_time: 60
      - id: "subway_zone"
        name: "地铁生态区"
        danger_level: 3
        resources: ["电缆", "电池", "轨道零件"]
        enemies: ["rad_rat", "cyber_ghoul"]
        special_loot: ["旧时代数据存储器"]
        extraction_time: 90
        night_boost: true
      - id: "wasteland_zone"
        name: "垃圾场生态区"
        danger_level: 4
        resources: ["废铁", "金属", "可回收塑料"]
        enemies: ["mutant_scavenger", "rad_wolf"]
        special_loot: ["大型机械部件"]
        extraction_time: 120
    modules:
      - id: "solar_panel"
        name: "太阳能电池板"
        space: 1
        build_cost: {"废铁": 50, "芯片": 20}
        maintenance: {"燃料": 1}
        effect: "每天自动生成 30 单位电力"
      - id: "water_recycler"
        name: "水循环器"
        space: 2
        build_cost: {"废铁": 80, "工具套件": 5}
        maintenance: {"燃料": 2}
        effect: "每天自动净化 50 升水"
      - id: "workbench"
        name: "工作台"
        space: 1
        build_cost: {"废铁": 30}
        effect: "解锁基本 crafting 配方"
      - id: "defense_turret"
        name: "防御炮塔"
        space: 1
        build_cost: {"废铁": 100, "芯片": 30, "电池": 50}
        effect: "自动攻击靠近的敌人，降低基地受到的伤害"
    recipes:
      - id: "basic_ammo"
        name: "基础弹药"
        cost: {"废铁": 10, "电池": 5}
        time: 30
        output: 10
      - id: "medical_kit"
        name: "医疗包"
        cost: {"药品": 5, "废铁": 10}
        time: 60
        output: 1
      - id: "toolkit"
        name: "工具套件"
        cost: {"废铁": 30, "芯片": 10}
        time: 90
        output: 1
      - id: "battery_charger"
        name: "电池充电器"
        cost: {"芯片": 20, "废铁": 40}
        time: 120
        output: 1
    npcs:
      - id: "dr_omega"
        name: "欧米茄医生"
        location: "锈铁方舟基地"
        personality: "冷漠但专业"
        services: ["治疗", "植入体安装", "属性提升"]
        relationship: 50
      - id: "trade_king"
        name: "交易之王"
        location: "市中心废墟"
        personality: "贪婪狡诈"
        services: ["物品交易", "情报出售"]
        relationship: 30
      - id: "old_soldier"
        name: "老兵杰克"
        location: "旧地铁系统"
        personality: "忠诚勇敢"
        services: ["战斗指导", "装备修理"]
        relationship: 40
    factions:
      - id: "steel_claw"
        name: "钢爪帮派"
        location: "市中心废墟"
        hostility: " hostile"
        goal: "控制资源点"
        power: 70
      - id: "tech_collective"
        name: "科技集体"
        location: "旧地铁系统"
        hostility: "neutral"
        goal: "研究旧时代科技"
        power: 50
    action_targets:
      - id: "search_rubble"
        name: "搜索瓦砾堆"
        action_type: "EXPLORATION"
        difficulty: 3
        location: "downtown_ruins"
        success_reward: ["废铁", "芯片"]
        failure_consequence: "可能遭遇敌人"
      - id: "hack_terminal"
        name: "黑入终端机"
        action_type: "RESEARCH"
        difficulty: 5
        location: "corporate_tower"
        success_reward: ["加密数据", "信用点"]
        failure_consequence: "触发警报，引来保安"
    starting_inventory:
      resources:
        废铁：50
        燃料：20
        食物包：10
        电池：15
      equipment:
        main_weapon: "自制手枪"
        chest: "加强夹克"
        legs: "工装裤"
        accessory_1: "多功能工具带"
      items:
        - "急救包 x2"
        - "压缩饼干 x5"
    disasters:
      - id: "rad_storm"
        name: "辐射尘暴"
        warning_time: 120
        duration: 720
        effects: "外部探索危险度 +50%,HP 每秒减少"
        safety_measure: "待在基地内可获得保护"
    event_pool:
      - id: "emergency_signal"
        name: "紧急求救信号"
        trigger_probability: 0.15
        description: "收到远处玩家的求救信号"
        options: ["前往救援", "忽略信号", "设下陷阱"]
      - id: "abandoned_supply"
        name: "废弃补给箱"
        trigger_probability: 0.20
        description: "发现上一个阶段的遗留补给"
        options: ["开箱获取", "标记为他人设陷阱", "原地报告"]
      - id: "tech_fallout"
        name: "科技余波"
        trigger_probability: 0.10
        description: "旧时代科技装置的异常反应"
        options: ["尝试修复", "拆除危险部件", "远离并记录"]
  
  mysteries:
    - "这个世界是如何变成废墟的？"
    - "旧时代的文明到底发生了什么？"
    - "是否存在其他幸存者聚集地？"
    - "辐射尘暴是否有可能被阻止？"
    - "量子核心的真正用途是什么？"
  
  phases:
    - name: "苟活求生"
      description: "第 1-20 天，主要目标是生存和基础建设"
      milestones: ["建立基地", "首次探索成功", "遭遇第一次灾难"]
    - name: "扩张发展"
      description: "第 21-50 天，开始与其他玩家互动和扩张"
      milestones: ["解锁高级模块", "与其他势力交涉", "击败第一个精英敌人"]

  motifs:
    - "黑暗中的人性光辉"
    - "科技的双刃剑效应"
    - "末世中的希望与绝望"

  taboo_domains:
    - "不要完全依赖 AI 决策"
    - "不要忽视资源的长期规划"
    - "不要在夜晚独自外出"

player_talent:
  name: "神经感应先驱"
  description: "你的大脑经过基因改造，能够感知周围的科技装置和网络波动"
  trigger: "每当附近有隐藏的电子设备、未发现的地点或被干扰的信号时"
  effect: "自动显示附近 50 米内的隐藏目标和潜在危险"
  limitations: "每次只能检测一个目标，冷却时间 5 分钟"
  mechanical_effect:
    action_modifiers:
      RESEARCH: 0.30
      EXPLORATION: 0.25
      HACKING: 0.35
    attribute_bonus:
      spirit: 3
  strategic_loop:
    input: "主动探索高风险区域，寻找隐藏的资源和秘密"
    conversion: "利用特殊感知能力发现别人无法找到的宝藏和捷径"
    competitive_impact: "前期资源优势明显，能更快升级基地和解开谜题"
    counterplay: "其他玩家可以通过范围搜索和团队合作弥补这一差距"
  opening_card:
    advantage: "第一天就能定位到附近的隐藏资源点和安全的探索路线，避免无谓的风险"
    first_use: "在游戏开始的清晨就使用，立即发现最近的高价值资源点"
    comparison: "普通玩家需要盲目探索或依赖运气，而你有了明确的导航"
    hard_limit: "每天只能使用 3 次，每次探测距离不能超过 500 米，且无法探测有伪装的目标"
