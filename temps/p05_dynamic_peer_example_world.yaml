# World Blueprint Example: Combat-Focused Survival World
# Demonstrates P0-5 Dynamic Peer Simulation Features

world_blueprint:
  # === SECTION 1: Custom Action Pool ( replaces hardcoded 4 actions )
  peer_actions:
    - COMBAT                    # Primary focus
    - EXPLORATION              # For resource gathering
    - FACTION_MANAGEMENT       # For building alliances
  
  # === SECTION 2: World-Specific Capability Formulas
  capability_formulas:
    COMBAT:
      description: "Warrior prowess emphasizes strength and constitution"
      attributes:
        - strength             # Heavy weapon mastery
        - constitution         # Endurance in prolonged fights
        - agility              # Dodging and parrying
      weights:
        - 0.5                  # Strength is king
        - 0.3                  # Toughness matters
        - 0.2                  # Some agility helps
    
    EXPLORATION:
      description: "Survival skills use perception and spirit"
      attributes:
        - perception           # Spotting dangers/traps
        - spirit               # Intuition for safe paths
        - agility              # Climbing/jumping obstacles
      weights:
        - 0.4                  # Awareness is key
        - 0.35                 # Gut instinct valuable
        - 0.25                 # Physical agility needed

# Messaging templates that feel combat-focused
messaging_templates:
  COMBAT_大成功_victory: "【{name}】以压倒性武力碾压敌人，战场归其掌控！"
  COMBAT_成功_win: "【{name}】在战斗中展现出精湛武艺"
  COMBAT_失败_defeat: "【{name}】被敌人击败倒地不起"
  EXPLORATION_大成功_discovery: "【{name}】发现了战略要地和资源点！"
  default: "【{name}】完成了{action_type}"


# Alternative example: Investigation/Navigation world
investigation_world:
  world_blueprint:
    peer_actions:
      - INVESTIGATION         # Core activity
      - NAVIGATION            # Route finding
      - CRAFTING              # Tool creation
      - COLLECT_RESOURCES     # Basic survival
    
    capability_formulas:
      INVESTIGATION:
        description: "Detective work emphasizes perception and lore knowledge"
        attributes:
          - perception         # Notice subtle clues
          - lore_knowledge     # Recognize patterns/history
          - intelligence       # Deductive reasoning
        weights:
          - 0.4                # Sight is primary
          - 0.35               # Knowledge base crucial
          - 0.25               # Logic ties it together
      
      NAVIGATION:
        description: "Navigation uses caution and spatial awareness"
        attributes:
          - caution              # Choose safe routes
          - agility              # Physical movement
          - spirit               # Intuitive direction-finding
        weights:
          - 0.45                 # Safety first
          - 0.3                  # Physical mobility needed
          - 0.25                 # Sixth sense helps

    messaging_templates:
      INVESTIGATION_大成功_breakthrough: "【{name}】破解了关键线索，真相浮出水面！"
      INVESTIGATION_小进展_lead: "【{name}】发现了一条有价值的线索"
      NAVIGATION_safe_route: "【{name}】找到了安全的通行路线"
      default: "{name}于第{turn}回合完成了{action_type}"


# Alternative example: Crafting/Social world  
social_crafting_world:
  world_blueprint:
    peer_actions:
      - CRAFTING              # Build items
      - SOCIAL_INTERACTION    # Network building
      - BUILD                 # Construct facilities
      - COLLECT_RESOURCES     # Gather materials
    
    capability_formulas:
      CRAFTING:
        description: "Crafting combines intelligence and constitution"
        attributes:
          - intelligence       # Technical understanding
          - constitution       # Stamina for long work sessions
          - agility            # Fine motor skills
        weights:
          - 0.5                # Brain over brawn
          - 0.3                # Long hours require stamina
          - 0.2                # Hand precision helps
      
      SOCIAL_INTERACTION:
        description: "Social bonds built on empathy and charisma"
        attributes:
          - empathy            # Understanding others' needs
          - charisma           # Personal magnetism
          - honesty            # Building trustworthiness
        weights:
          - 0.45               # Genuine care matters most
          - 0.35               # Charisma opens doors
          - 0.2                # Trust sustains relationships

    messaging_templates:
      CRAFTING_masterpiece: "【{name}】打造出了传世精品！"
      SOCIAL_结盟_alliance: "【{name}】与多名盟友建立了合作关系"
      default: "{name}展现了精湛的{action_type}技艺"


# Backward compatibility note:
# If a world doesn't specify these sections, the system falls back to:
# - Default action pool: ["EXPLORATION", "COMBAT", "BUILD", "SOCIAL_INTERACTION"]
# - Standard 7-RPG-attributes formulas
# - Generic message templates
#
# This ensures all existing saves continue working without modification.
