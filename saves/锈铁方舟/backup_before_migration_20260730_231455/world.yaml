    world_creator: llm
    generated_fields: []
  world_blueprint:
    opening_area:
      id: rust_station
      name: 锈蚀车站
      description: 列车起点的废弃车站，周围散落着翻覆的车厢和生锈的集装箱，可能有幸存物资
      danger_hint: 白天有少量辐射蝎出没，夜间变异犬群会聚集
      primary_attribute: agility
    opening_enemy:
      id: rad_scorpion
      name: 辐射蝎
      description: 体长一米的变异蝎子，尾刺带有神经毒素
      knowledge_hint: 腹部甲壳较薄，翻滚闪避后攻击可造成双倍伤害
    investigation_site:
      id: signal_tower_ruins
      name: 信号塔废墟
      description: 一座半倒塌的通讯塔，周围凝结着发光的共鸣晶体。靠近时会感到头痛和幻听
      danger_hint: 共鸣波每20分钟脉冲一次，精神值快速下降
    starting_npc:
      id: old_jin
      name: 老金
      description: 车站废墟中的流浪老人，曾是一名列车工程师，愿意用知识换取食物
      goal: 修复列车引擎，离开这片荒原，回到文明世界
      profession: mechanic
      disposition: 谨慎友善
    starting_faction:
