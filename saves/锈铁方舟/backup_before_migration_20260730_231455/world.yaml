world:
  name: 锈铁方舟
  theme: 废土列车
  narrative_style: 冷酷写实
  difficulty: 标准
  narrative_length: 3
  language: 中文
  genre_contract:
    id: mass_system_survival
    name: 全民系统投放型求生
    collective_transmission: true
    shared_start: true
    region_size: 1000
    global_count: 100000000
    public_system:
      regional_chat: true
      private_chat: true
      trading: true
      rankings: true
      achievements: true
      announcements: true
    protagonist_contract:
      unique_mechanic_required: true
      comparative_advantage_target: 0.6
      automatic_success: false
      tone:
      - rational
      - confident
      - proactive
    population_distribution:
      panicked_players:
        min: 0.15
        max: 0.2
      ordinary_players:
        min: 0.45
        max: 0.55
      skilled_players:
        min: 0.2
        max: 0.25
      regional_elites:
        min: 0.05
        max: 0.08
      special_rivals:
        min: 0.01
        max: 0.03
    difficulty_calibration:
      system_operations:
        resistance_min: 0
        resistance_max: 6
      daily_talk:
        resistance_min: 4
        resistance_max: 8
      newbie_exploration:
        resistance_min: 10
        resistance_max: 16
      normal_danger:
        resistance_min: 18
        resistance_max: 24
      high_risk:
        resistance_min: 28
        resistance_max: 38
    failure_distribution:
      critical_success_pct:
        min: 0.08
        max: 0.1
      normal_success_pct:
        min: 0.7
        max: 0.75
      costly_success_pct:
        min: 0.15
        max: 0.22
      partial_failure_pct:
        min: 0.55
        max: 0.65
      severe_failure_pct:
        min: 0.3
        max: 0.4
      catastrophic_failure_pct: 0.05
  professions:
    scavenger:
      name: 拾荒者
      description: 精通从废墟中回收物资，对危险区域有敏锐直觉
      attribute_focus: agility
    mechanic:
      name: 机械师
      description: 能修复和改造列车部件与武器，降低建造成本
      attribute_focus: constitution
    scout:
      name: 侦察兵
      description: 移动速度快，视野范围广，擅长预判威胁
      attribute_focus: agility
    medic:
      name: 医疗兵
      description: 能处理伤口和调配药剂，延缓精神衰退
      attribute_focus: spirit
  starting_profession: scavenger
  setting:
    safe_base: 灰烬号列车
    external_dangers:
    - 辐射风暴（周期性席卷废土）
    - 变异兽群（夜间出没的捕食者）
    - 流浪掠夺者车队
    - 精神污染区（信号塔废墟的共鸣波）
    exploration_method: 驾驶列车前往不同站点废墟，下车探索后必须在辐射风暴前返回
    disaster_cycle: 每7天一次辐射风暴
    disaster_type: 辐射风暴：全区域精神值-15，未庇护者HP-20，列车耐久-10
  resources:
    primary:
    - name: 净水
      description: 过滤后的饮用水，最紧缺的生存物资
    - name: 废铁
      description: 可回收金属，用于修复和建造
    - name: 燃料棒
      description: 列车动力来源，也用于供暖和发电
    - name: 食物罐头
      description: 保质期不确定的压缩口粮
    secondary:
    - name: 电子元件
      description: 精密零件，用于升级列车模块
    - name: 药材
      description: 野生药草和化学原料
    rare:
    - name: 共鸣晶体
      description: 信号塔废墟中凝结的能量体，极为珍贵
    currency: 净水单位
  public_survival:
    system_name: 末日方舟系统
    region_name: 第七扇区·铁锈荒原
    opening_announcement: '【末日方舟系统公告】第七扇区已激活。1,000名投放者已就位。

      你们拥有一列初始列车和七天缓冲期。第七天日落时，第一轮辐射风暴降临。

      存活者进入下一阶段。系统将持续记录你们的生存数据。祝你们好运。'
    opening_rules:
    - 每7天一次辐射风暴，不在列车内或庇护所中的人将受到致命伤害
    - 排行榜每小时更新，综合评分=存活天数×资源储备×探索深度
    - 区域频道公开可用，但发言会暴露你的位置和策略
    - 掠夺者NPC每3天巡逻一次，独行且无武装者优先被袭击
    - 信号塔废墟有稀有物资，但共鸣波会造成精神损伤
    - 系统不干预PVP，但击杀投放者会被标记并降低交易信誉
    starting_channel_messages:
    - sender: 铁拳·马库斯
      message: 我的列车已经加固了装甲板，谁想结盟？资源共享。
    - sender: 幽灵·蕾娜
      message: 别在频道里暴露位置。我已经找到第一个物资点了。
    - sender: 教授·陈
      message: 有人注意到信号塔废墟的能量读数吗？那不是普通的辐射。
    - sender: 新人0742
      message: 天啊这是真的吗？我连水都不够喝三天……
    initial_peers:
    - id: peer_marcus
      name: 铁拳·马库斯
      opening_strategy: 快速加固列车装甲并招募盟友，建立小型车队
      visible_edge: 重型改装列车，装甲防御是普通列车的两倍
    - id: peer_lena
      name: 幽灵·蕾娜
      opening_strategy: 隐蔽行动，独自探索高价值废墟后迅速撤离
      visible_edge: 拥有隐身模块原型，探索时不易被发现
    - id: peer_chen
      name: 教授·陈
      opening_strategy: 研究信号塔废墟，试图理解共鸣波的规律以获取技术优势
      visible_edge: 前科研人员，拥有信号分析仪的蓝图
    - id: peer_viper
      name: 毒蛇·卡里姆
      opening_strategy: 武装列车，拦截其他投放者的物资运输线
      visible_edge: 初始装备有突击步枪和弹药，战斗经验丰富
    competition:
      initial_percentile: 0
      outcome_scores:
        普通成功: 15
        大成功: 30
        失败但获得部分信息: 5
        严重失败: -6
        失败: -3
      location_discovery_bonus: 10
      knowledge_bonus: 5
      positive_resource_bonus_cap: 20
      percentile_per_score: 0.5
      loss_roll_threshold: 85
      losses_per_trigger: 1
      rank_season_end_turn: 100
      active_rival_count: 2
  rules:
    safe_zone:
      description: 列车内部提供基础防护，抵挡轻度辐射和野兽
      limitation: 列车耐久降至零时防护完全失效
    exploration:
      frequency: 每天一次外出探索
      return_rule: 必须在日落前或风暴前返回列车
      night_modifier: 夜间危险×2，变异兽出没
    death:
      type: checkpoint
      inventory_drop_rate: 0.7
    disaster:
      cycle_days: 7
      first_event: 第7天
      escalation: 每次风暴辐射强度+10%，影响范围扩大
    pvp:
      enabled: true
      safe_zone_pvp: false
    progression:
      player_level: true
      base_level: true
      talent_per_level: true
