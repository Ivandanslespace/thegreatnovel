<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="csrf-token" content="{{ csrf_token }}"><title>Workflow Handoff</title><link rel="stylesheet" href="{{ url_for('static', path='style.css') }}"></head>
<body><header class="topbar"><a class="brand" href="/">小说作者工作台</a><span class="muted">Workflow Handoff</span></header><main class="shell narrow"><section class="page-heading"><div><p class="eyebrow">Local File Handoff Protocol</p><h1>准备任务</h1></div></section><section class="stat-grid"><article class="panel"><h2>续写</h2><p>Web 只冻结任务并生成指令；Codex 桌面端手动领取。</p><form data-api-form method="post" action="/api/books/{{ book_id }}/handoffs/continuation"><label>requested_stage<select name="requested_stage"><option>PLAN_ONLY</option><option>DRAFT_AND_VALIDATE</option></select></label><label>Edition ID<input name="edition_id" value="{{ edition_id or '' }}"></label>{% include 'innovation_controls.html' %}<button class="button primary" type="submit">准备续写 Handoff</button></form></article><article class="panel"><h2>改写</h2><p>只进入影响审计/计划，不批准 Campaign 或启用 Edition。</p><form data-api-form method="post" action="/api/books/{{ book_id }}/handoffs/revision"><label>requested_stage<select name="requested_stage"><option>IMPACT_AND_PLAN</option></select></label><label>Edition ID<input name="edition_id" value="{{ edition_id or '' }}"></label>{% include 'innovation_controls.html' %}<button class="button primary" type="submit">准备改写 Handoff</button></form></article></section><section class="panel"><h2>已有任务</h2><p><a class="button" href="/books/{{ book_id }}/jobs">查看状态、事件与 WAITING_FOR_USER</a></p></section></main><script src="{{ url_for('static', path='app.js') }}" defer></script></body></html>
