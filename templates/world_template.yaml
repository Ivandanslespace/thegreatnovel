# 世界创建模板
# LLM 在每次新世界创建时原创全部语义内容；本模板只定义结构和可执行出口。

world:
  name: ""                    # 世界名称（默认由主题生成，可由高级入口覆盖）
  theme: ""                   # 主题描述
  narrative_style: ""         # 叙述风格（冷酷/幽默/史诗/日常）
  difficulty: ""              # 休闲/标准/硬核
  narrative_length: 7         # 叙述长度偏好(1-10)，每轮约 length×100~120字
  language: "中文"            # 游戏语言（任何语言，默认中文）
  genre_contract: "1"         # 1=全民系统投放，2=百倍奖励，3=孤独生存；创建时会固化成合同对象

  # 职业系统（可选）：由本次 LLM 世界包原创；没有全局职业白名单或示例回填。
  professions: {}
  starting_profession: null

  # 核心设定
  setting:
    safe_base: ""             # LLM 创作
    external_dangers: []      # LLM 创作
    exploration_method: ""    # LLM 创作
    disaster_cycle: ""        # LLM 创作，必须包含正整数天数
    disaster_type: ""         # LLM 创作

  # 资源体系
  resources:
    primary: []               # LLM 创作，3-5种
    secondary: []             # LLM 创作
    rare: []                  # LLM 创作
    currency: ""              # LLM 创作；无交易世界可为空

  # 仅在全民类型中必填。所有文字由本次 LLM 原创，第一段叙述必须直接展示它们。
  # 这样玩家在第一次选择前就知道：谁在同区、如何输赢、能在哪里竞争。
  public_survival:
    system_name: ""
    region_name: ""
    opening_announcement: ""
    opening_rules: []          # 4-6 条；写成玩家立刻能执行或会受惩罚的直白规则
    starting_channel_messages: # 3-5 条；每条都必须含 sender / message
      - sender: ""
        message: ""
    initial_peers:             # 3-5 名；每人必须含 id / name / opening_strategy / visible_edge
      - id: ""
        name: ""
        opening_strategy: ""
        visible_edge: ""

  # 世界规则
  rules:
    safe_zone:
      description: "基地内部受到保护"
      limitation: "基地核心被摧毁后保护失效"
    exploration:
      frequency: "每天一次"
      return_rule: "找到撤离点才能返回"
      night_modifier: "夜间危险×2"
    death:
      type: ""                # permanent/checkpoint/legacy
      inventory_drop_rate: 0.7
    disaster:
      cycle_days: 7
      first_event: ""
      escalation: "每次灾难强度+10%"
    pvp:
      enabled: true
      safe_zone_pvp: false
    progression:
      player_level: true
      base_level: true
      talent_per_level: true  # 每级三选一

  # 世界创建审计元数据（由 tools/create_save.py 写入）
  generation:
    mechanics_source: "llm_world_blueprint"
    world_creator: "llm"
    generated_fields: []

  # LLM 的原创世界蓝图。名称、敌人、NPC、势力、物件和模块不应引用预设库。
  # Python 只从此蓝图派生成本、行动约束和 SQLite 注册表。
  world_blueprint:
    opening_area:
      id: ""
      name: ""
      description: ""
      danger_hint: ""
      primary_attribute: ""
    opening_enemy:
      id: ""
      name: ""
      description: ""
      knowledge_hint: ""
    investigation_site: null
    starting_npc: null
    starting_faction: null
    base_modules: []
    starter_kit:
      main_weapon:
        id: ""
        name: ""
        attack_type: ""
      items: []
    starter_recipe:
      id: ""
      name: ""
      description: ""

  # 主题编译器生成的可执行世界注册表
  generation_bundle: {}
  locations: []
  targets: {}
  combat_targets: {}
  enemy_definitions: {}
  encounter_entities: {}
  areas: {}
  farm_areas: {}
  build_catalog: {}
  modules: {}
  recipes: []
  disasters: []
  action_targets: {}
  starting_inventory: {}
  starting_npcs: []
  starting_factions: []
  starting_relationships: []

  # 怪物生态
  monsters:
    day_creatures: []         # 白天怪物类型
    night_creatures: []       # 夜晚怪物类型
    bosses: []                # 已知BOSS
    ecology_notes: ""         # 生态关系说明

  # 长期悬念和阶段规划也由 LLM 创作；允许为空，但不可引用其他主题的预设剧情。
  mysteries: []
  phases: []

  # 创意槽位（控制主题编译器生成各类创意元素的数量）
  creative_slots:
    signature_anomalies: 5
    living_resources: 3
    taboo_rules: 4
    macro_crises: 3
    forced_convergences: 2
    hidden_civilizations: 2
    system_irregularities: 3
  motifs: []
  taboo_domains: []

# 主角天赋（LLM 为本次世界原创；必须同时给出能力边界）
player_talent:
  name: ""
  description: ""
  type: ""                    # 信息类/个人类/建设类/规则类
  trigger: ""                 # 触发条件
  effect: ""                  # 具体效果
  limitations: ""             # 限制条件
  # 天赋意象与内容由 LLM 原创；作用域用于让 Python 把它落到真实结算，而不是只当文案。
  mechanical_focus: ""        # exploration/research/combat/construction/social/survival 之一
  opening_card:
    advantage: ""             # 它为何明显强于普通玩家
    first_use: ""             # 第一天立即怎样使用
    comparison: ""            # 普通玩家做同类事时缺少什么
    hard_limit: ""            # 不能做什么、代价或冷却
