# 世界创建模板
# LLM 在每次新世界创建时原创全部语义内容；本模板只定义结构和可执行出口。

world:
  name: ""                    # 世界名称（默认由主题生成，可由高级入口覆盖）
  theme: ""                   # 主题描述
  narrative_style: ""         # 叙述风格（冷酷/幽默/史诗/日常）
  difficulty: ""              # 休闲/标准/硬核
  narrative_length: 7         # 叙述长度偏好 (1-10)，每轮约 length×100~120 字
  language: "中文"            # 游戏语言（任何语言，默认中文）
  genre_contract: "1"         # 1=全民系统投放，2=百倍奖励，3=孤独生存；创建时会固化成合同对象

  # 职业系统（可选）：由本次 LLM 世界包原创；没有全局职业白名单或示例回填。
  professions: {}
  starting_profession: null

  # 升级时的三选一卡池。由本次 LLM 与世界一起原创，不得使用跨世界固定职业、
  # 天赋类别或示例能力。至少三张；每张须含 id/name/description/rarity/effect。
  # effect 是可执行合同，例如 attribute_bonus 或 action_modifiers；名称、意象、
  # 触发逻辑与取舍完全由本世界决定。
  talent_deck: []

  # 核心设定
  setting:
    safe_base: ""             # LLM 创作
    external_dangers: []      # LLM 创作
    exploration_method: ""    # LLM 创作
    disaster_cycle: ""        # LLM 创作，必须包含正整数天数
    disaster_type: ""         # LLM 创作

  # 资源体系
  resources:
    primary: []               # LLM 创作，3-5 种
    secondary: []             # LLM 创作
    rare: []                  # LLM 创作
    currency: ""              # LLM 创作；无交易世界可为空

  # 仅在全民类型中必填。所有文字由本次 LLM 原创，第一段叙述必须直接展示它们。
  # 这样玩家在第一次选择前就知道：谁在同区、如何输赢、能在哪里竞争。
  public_survival:
    system_name: ""
    region_name: ""
    opening_announcement: ""
    opening_rules: []          # 4-6 条；写成玩家立刻能执行或会受惩罚的直白规则
    starting_channel_messages: # 3-5 条；每条都必须含 sender / message
      - sender: ""
        message: ""
    initial_peers:             # 3-5 名；每人必须含 id / name / opening_strategy / visible_edge
      - id: ""
        name: ""
        opening_strategy: ""
        visible_edge: ""
    # 全民推进由本局合同决定，不能使用跨世界固定的死亡率、积分或排名速度。
    competition:
      initial_percentile: null
      outcome_scores: {}
      location_discovery_bonus: null
      knowledge_bonus: null
      positive_resource_bonus_cap: null
      percentile_per_score: null
      loss_roll_threshold: null
      losses_per_trigger: null
      rank_season_end_turn: null
      active_rival_count: null

  # 世界规则 - 必须明确定义，否则全部禁用
  
  # NOTE: 以下所有 rules.*字段均为占位符，默认值全为 null。
  # LLM 在创建世界时必须显式定义每个要启用的机制及其参数。
  # 任何未定义的规则字段将不会生效，防止注入虚假的通用生存规则。
  rules:
    safe_zone: null           # null = 无保护区域机制；需定义{description, limitation, boundary_rules?}
    exploration: null         # null = 无探索限制；需定义{frequency, return_rule, night_modifier?, cost?}
    death: null               # null = 无死亡惩罚；需定义{type: permanent/checkpoint/legacy, inventory_drop_rate?}
    disaster: null            # null = 无周期性灾难；需定义{cycle_days?, first_event, escalation?}
    pvp: null                 # null = 禁止玩家对战；需定义{enabled, safe_zone_pvp?, mechanics?}
    progression: null         # null = 无等级系统；需定义{player_level, base_level, talent_per_level?}
  
  # 机制注册表 - 用于声明世界支持的可执行机制
  # 这是比 rules 更底层的契约：LLM 在此声明世界实际具备的系统能力
  mechanics:
    capabilities: {}          # 空字典，LLM 填入世界实际启用的能力（如 base_protection, exploration_limit 等）
    rulesets: {}              # 自定义规则集注册表，按世界需求原创
    ranking:                  # 排名系统配置；如需启用则填充此节
      enabled_dimensions: []  # 默认显示维度；自动填充时提供维度 ID 列表
      dimension_weights: {}   # 维度权重总和=1.0(±0.05)
      dimension_scales: {}    # 维度缩放系数/bonuses
  
  # 系统能力开关：由 LLM 根据世界类型声明启用的子系统
  # combat: 战斗相关（敌人、区域敌群、提取规则）
  # building: 建造模块（模块、空间成本）  
  # crafting: 制作系统（配方、资源转化）
  # trading: 交易系统（市场、税价）
  # factions: 势力系统（NPC 关系影响度）
  # disasters: 灾难系统（周期事件与预警）
  mechanics:
    capabilities:
      combat: true            # 启用战斗系统（若为 false，enemies/areas 的敌群字段变为可选）
      building: true          # 启用建造系统（若为 false，modules 变为可选）
      crafting: true          # 启用制作系统（若为 false，recipes 变为可选）
      trading: true           # 启用交易系统（依赖 factions）
      factions: true          # 启用势力系统（若为 false，factions 变为可选）
      disasters: true         # 启用灾难系统（若为 false，disasters 变为可选）

  # 世界创建审计元数据（由 tools/create_save.py 写入）
  generation:
    mechanics_source: "llm_world_blueprint"
    world_creator: "llm"
    generated_fields: []

  # LLM 的完整原创首日世界包。Python 只校验、索引与登记，绝不补默认数值或内容。
  # 每一条记录均须给出自己可执行的数值、成本、限制和状态效果。
  world_blueprint:
    starting_location: ""
    locations: []             # id/name/safe/discovered/往返与撤离成本
    enemies: []               # id/name/属性/掉落/所在地点；不得省略数值
    areas: []                 # 区域生态、敌群、采集表现与撤离规则
    modules: []               # 模块的空间、建造、维护与实际效果
    recipes: []               # 配方成本、时间与产出逻辑
    npcs: []                  # NPC 地点、日程、目标、自主产出与效用
    factions: []              # 势力地点、目标、财政、税率与效用
    relationships: []         # 与已注册 NPC 的初始关系
    action_targets: []        # 每个可行动目标的行动类型、难度、地点、效果分支
    starting_inventory:       # 起始资源、装备和物品；全部由本世界定义
      resources: {}
      equipment: {}
      items: []
    disasters: []             # 灾难类型、周期与预警
    event_pool: []            # 至少三个原创后续事件；不得按主题名回填
    creative_slots: {}        # 本局事件频率预算

  # 主题编译器生成的可执行世界注册表
  generation_bundle: {}
  locations: []
  targets: {}
  combat_targets: {}
  enemy_definitions: {}
  encounter_entities: {}
  areas: {}
  farm_areas: {}
  build_catalog: {}
  modules: {}
  recipes: []
  disasters: []
  action_targets: {}
  starting_inventory: {}
  starting_npcs: []
  starting_factions: []
  starting_relationships: []

  # 怪物生态
  monsters:
    day_creatures: []         # 白天怪物类型
    night_creatures: []       # 夜晚怪物类型
    bosses: []                # 已知 BOSS
    ecology_notes: ""         # 生态关系说明

  # 长期悬念和阶段规划也由 LLM 创作；允许为空，但不可引用其他主题的预设剧情。
  mysteries: []
  phases: []

  motifs: []
  taboo_domains: []

# 主角天赋（LLM 为本次世界原创；必须同时给出能力边界）
player_talent:
  name: ""
  description: ""
  trigger: ""                 # 触发条件
  effect: ""                  # 具体效果
  limitations: ""             # 限制条件
  # Python 不再按"信息/个人/建设"或固定作用域替能力套模板。
  # LLM 直接给出本能力实际改变的、可审计的行动修正合同。
  mechanical_effect:
    action_modifiers: {}
  # 独占循环而非单次便利：主角取得什么、如何转化、会怎样影响同区竞争，以及他人如何反制。
  strategic_loop:
    input: ""
    conversion: ""
    competitive_impact: ""
    counterplay: ""
  opening_card:
    advantage: ""             # 它为何明显强于普通玩家
    first_use: ""             # 第一天立即怎样使用
    comparison: ""            # 普通玩家做同类事时缺少什么
    hard_limit: ""            # 不能做什么、代价或冷却
