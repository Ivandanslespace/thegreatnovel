# 玩家状态模板
player:
  name: ""
  gender: ""
  age: ""
  background: ""              # 穿越前职业/身份

  # 基础属性
  level: 1
  exp: 0
  exp_to_next: 100
  attributes:
    strength: 5
    constitution: 5
    agility: 5
    spirit: 5
  free_points: 4              # 初始自由分配点

  # 生命与状态
  hp: 50                      # 体质×10
  max_hp: 50
  status_effects: []          # 当前状态效果
  hunger: 100                 # 饥饿值(100=饱)
  fatigue: 0                  # 疲劳值(0=精力充沛)
  mental: 100                  # 精神值
  max_mental: 100

  # 天赋
  talents: []                 # 已获得天赋列表
  # - name: ""
  #   type: ""
  #   rarity: ""
  #   effect: ""
  #   obtained_turn: 0

  # 技能
  skills: []
  # - id: ""
  #   name: ""
  #   level: 1
  #   cooldown_remaining: 0

  # 职业
  class: null                 # 未转职
  second_class: null          # 第二职业（隐藏）

  # 人格（隐藏，不展示给玩家）
  personality:
    caution: 50
    ambition: 50
    empathy: 50
    honesty: 50
    risk_tolerance: 50
    collectivism: 50

  # 成就
  achievements: []

  # 统计
  stats:
    kills: 0
    deaths: 0
    explorations: 0
    crafts: 0
    trades: 0
