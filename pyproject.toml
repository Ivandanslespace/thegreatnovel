[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "novel-authoring-system"
version = "0.1.0"
description = "Codex-driven, local and auditable long-form novel continuation workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
novel = "novel_authoring.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/novel_authoring"]

[tool.hatch.build.targets.wheel.force-include]
"config/default.yaml" = "novel_authoring/default.yaml"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src/novel_authoring"]
