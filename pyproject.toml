[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "novel-authoring-system"
version = "0.1.0"
description = "Codex-driven, local and auditable long-form novel continuation workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
]

[project.scripts]
novel = "novel_authoring.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/novel_authoring"]

[tool.hatch.build.targets.wheel.force-include]
"config/default.yaml" = "novel_authoring/default.yaml"
"config/metrics_registry.yaml" = "novel_authoring/metrics_registry.yaml"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/novel_authoring/cli.py" = ["E501", "E702"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src/novel_authoring"]

[[tool.mypy.overrides]]
module = ["novel_authoring.web.*"]
ignore_missing_imports = true
allow_untyped_decorators = true

[[tool.mypy.overrides]]
module = ["fastapi", "fastapi.*", "uvicorn", "jinja2"]
ignore_missing_imports = true
